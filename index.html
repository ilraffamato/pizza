.ticket .k{text-align:center;font-size:22px;border:2px solid #000;margin:6px 0;padding:4px}

.ticket .r{display:flex;justify-content:space-between;gap:8px}
.ticket .md{padding-left:14px;font-size:14px}
.ticket.c .it{font-size:20px;margin-top:8px}.ticket.c .md{font-size:18px}
@media print{body{background:#fff;padding:0}.noprint{display:none!important}.tickets{display:block;padding:0}
.ticket{width:72mm;box-shadow:none;border-radius:0;margin:0;break-after:page}}
@page{margin:4mm}

<div class="wrap n"><p class="empty">${P.length-1} voci · ${P.filter(p=>!p[2]&&p[3]!='B').length} senza ingredienti · ${P.filter(p=>!p[5]&&p[3]!='B'&&p[3]!='X').length} senza MAXI</p>
<input class="t" placeholder="Cerca una pizza…" value="${esc(S.q||'')}" oninput="S.q=this.value;document.getElementById('dbl').innerHTML=dbList()">
<div class="chips" style="margin:12px 0">${F.map(f=>`<button class="chip ${(S.f||'')==f[0]?'on':''}" data-a="flt" data-v="${f[0]}">${f[1]}</button>`).join('')}</div>
<div id="dbl">${dbList()}</div>
<div class="chips" style="margin:18px 0"><button class="btn" data-a="export">Esporta backup</button><button class="btn" data-a="impb">Importa backup</button><button class="btn" data-a="reset">Ripristina iniziale</button></div>
<input type="file" id="imp" accept=".json,application/json" hidden onchange="imp(this)"></div>`}
function vEdit(){const e=S.e,B=e.c=='B';
 return`<div class="bar"><button class="btn" data-a="dbback">‹ Database</button><h2>${e.i<0?'NUOVA PIZZA':'MODIFICA'}</h2><span></span></div>
<div class="wrap n"><div class="box"><label class="lbl">NOME</label><input class="t l" value="${esc(e.n)}" oninput="S.e.n=this.value" ${B?'disabled':''}>
${B?'':`<label class="lbl">CATEGORIA</label><div class="chips">${CATL.map(c=>`<button class="chip ${e.c==c[0]?'on':''}" data-a="ec" data-v="${c[0]}">${c[1]}</button>`).join('')}</div>`}
<label class="lbl">PREZZO €</label><input class="t l" inputmode="decimal" value="${esc(e.p)}" oninput="S.e.p=this.value">
${B||e.c=='X'?'':`<label class="lbl">PREZZO MAXI € (vuoto = si inserisce a mano in cassa)</label><input class="t l" inputmode="decimal" value="${esc(e.m)}" oninput="S.e.m=this.value">`}
${B?'':`<label class="lbl">INGREDIENTI (separati da virgola)</label><textarea class="t l" oninput="S.e.g=this.value">${esc(e.g)}</textarea>
<div class="chips" style="margin-top:12px"><button class="chip ${e.a?'on':''}" data-a="eau">? Ingredienti da verificare</button></div>`}</div>
<div style="display:flex;gap:10px">${e.i>=0&&!B?'<button class="btn" data-a="edel">Elimina</button>':''}<button class="btn fill" style="flex:1;font-size:19px" data-a="esave">Salva</button></div></div>`}
// Aggiunte: [gruppo, prezzo, voci separate da |]
const AG=[['Verdure',.5,'Patate|Rucola|Cipolla|Panc. stuf.'],['Prosciutto cotto e altro',.5,'Prosciutto|Salsiccia|Carciofi|Funghi champignon|Ricotta fresca|Mais'],
['Formaggi e altro',1,'Formaggi|Stracchino|Uovo|Radicchio Chioggia|Salamino'],['Affettati',1.5,'Panc. arr.|Crudo|Speck|Bresaola'],
['Altro',1.5,'Asparagi|Chiodini|Crema di zucca|Grana e formaggio vecchio|Noci|Pesto|Pomini|Pomodoro secco|Tonno|Radicchio TV|Radicchio Verdon|Burrata (mezza pizza)'],
['Speciali',2,'Acciughe|Bufala|Friarielli|Gamberetti|Solo bufala'],['Premium',2.5,'Burrata|Olive|Porcini|Mozz. senza lattosio / vegana']];
const PR={};AG.forEach(g=>g[2].split('|').forEach(n=>PR[n]=g[1]));PR['Mais']=.5;
// Prezzo del "Doppio" = prezzo dell'aggiunta equivalente; 0 se non c'è nel listino (DA CONFERMARE)
const DP=[[/mais/,2.5],[/bufala/,2],[/burrata/,2.5],[/acciughe|gamberetti|friarielli/,2],[/porcini|olive/,2.5],
[/chiodini|asparagi|tonno|noci|pesto|pomodoro secco|grana|pecorino|crudo|speck|bresaola|bres/,1.5],
[/gorgonzola|emmental|brie|scamorza|feta|stracchino|salamino|ricotta affumicata/,1],
[/prosciutto|salsiccia|carciofi|funghi|patate|rucola|cipolla|pancetta|peperoni|zucchine|melanzane|pomodorini|ricotta/,.5]];
const dp=n=>{for(const[r,p]of DP)if(r.test(n))return p;return 0};
const SZ=[['N','Normale'],['B','Battuta'],['F','Formato Famiglia'],['M','MAXI'],['Y','Baby']];
const IM=[['','Impasto normale',0],['DP','Doppia pasta',1],['MC','Multicereale',1.5],['SG','Senza glutine',4]];
// ====== LOGICA ======
const E=n=>'€ '+n.toFixed(2).replace('.',',');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const ab=n=>cap(n.replace('pancetta arrotolata','panc. arr.').replace('pancetta stufata','panc. stuf.').replace('mozzarella','mozz.').replace('pomodoro','pom.'));
let S={hist:false,view:'menu',tab:'S',d:null,sheet:false,cart:[],name:'',order:null};
const mx=d=>parseFloat(String(d.maxi||'').replace(',','.'))||0;
const szAdj=d=>({N:0,B:2,F:4.5,M:0,Y:/^MARG|^MARIN/.test(d.p[0])?-.5:-1}[d.size]);
function unit(d){let t=(d.size=='M'?d.p[5]||mx(d)||d.p[1]:d.p[1])+szAdj(d)+IM.find(i=>i[0]==d.imp)[2];
 d.ing.forEach(x=>{if(x.s==2)t+=dp(x.n)});for(const k in d.agg)t+=PR[k]*d.agg[k];return t}
function head(d){return d.p[0]+(d.size!='N'?' - '+SZ.find(s=>s[0]==d.size)[1].toUpperCase():'')}
function mods(d){const m=[];if(d.imp)m.push(IM.find(i=>i[0]==d.imp)[1].toUpperCase());
 d.ing.forEach(x=>{if(x.s==1)m.push('NO '+ab(x.n));if(x.s==2)m.push('DOPPIO '+ab(x.n))});
 for(const k in d.agg)m.push('+ '+k+(d.agg[k]>1?' x'+d.agg[k]:''));if(d.note)m.push('>> '+d.note);return m}
function newDraft(p){return{p,cat:p[3],size:'N',imp:'',maxi:'',agg:{},note:'',ing:p[2]?p[2].split(',').map(s=>({n:s.trim(),s:0})):[]}}
const total=()=>S.cart.reduce((t,l)=>t+l.u*l.q,0);
const nCart=()=>S.cart.reduce((t,l)=>t+l.q,0);

function vMenu(){const list=P.filter(p=>p[3]==S.tab);
 const col=S.tab=='V'?'var(--grn)':'var(--red)';
 const tb=(k,t,c)=>`<button data-a="tab" data-v="${k}" class="${S.tab==k?'on':''}" style="--c:${c||'var(--red)'}">${t}</button>`;
 return`<div class="logo"><b>PIZZERIA</b><span>SAN LAZZARO</span><small>CON FORNO A LEGNA</small></div>
<nav class="tabs">${tb('S','Speciali')}${tb('C','Classiche')}${tb('V','Vegane','var(--grn)')}${tb('X','Extra')}${tb('A','Altre pizze')}</nav>
<div class="wrap"><button class="base" data-a="base">BASE PIZZA · € 7,00<small>Componi la tua pizza (se non è una margherita)</small></button><div class="grid">${list.map(p=>`<button class="pz" data-a="pz" data-i="${P.indexOf(p)}" style="--c:${col}">${p[4]?'<b class="qm">?</b>':''}<span>${esc(p[0])}</span><i class="pill">${E(p[1])}</i></button>`).join('')}</div><div class="chips" style="padding:6px 0 24px"><button class="btn" data-a="hist">🧾 Storico ordini</button><button class="btn" data-a="db">⚙ Database pizze</button></div></div>
${S.cart.length?`<div class="dock"><div><button class="btn fill" data-a="cart" style="display:flex;justify-content:space-between"><span>Ordine (${nCart()})</span><span>${E(total())}</span></button></div></div>`:''}`}

function vPizza(){const d=S.d,x=d.cat=='X',col=d.cat=='V'?'var(--grn)':'var(--red)';
 const ok=k=>k=='N'||(!x&&k!='M')||(!x&&k=='M');
 return`<div class="bar" style="color:${col}"><button class="btn" data-a="back">‹ Menu</button><h2>${esc(d.p[0])}</h2><span></span></div>
<div class="wrap n">
<div class="box o"><h3>DIMENSIONE</h3><div class="chips">${SZ.map(s=>`<button class="chip ${d.size==s[0]?'on':''}" data-a="size" data-v="${s[0]}" ${ok(s[0])?'':'disabled'}>${s[1]}${s[0]=='M'&&d.p[5]?' '+E(d.p[5]):''}</button>`).join('')}</div>
${d.size=='M'&&!d.p[5]?`<div class="mx">Prezzo MAXI € <input class="t" inputmode="decimal" placeholder="0,00" value="${esc(d.maxi)}" oninput="S.d.maxi=this.value;upd()"></div>`:''}
${x?'':`<h3 class="sub">IMPASTO</h3><div class="chips">${IM.map(i=>`<button class="chip ${d.imp==i[0]?'on':''}" data-a="imp" data-v="${i[0]}">${i[1]}${i[2]?' +'+E(i[2]).slice(2):''}</button>`).join('')}</div>`}</div>
<div class="box"><h3>INGREDIENTI${d.p[4]?' ?':''}</h3>${d.p[4]?'<p class="empty">? Ingredienti generati automaticamente dal nome della pizza: da verificare.</p>':''}${d.ing.length?d.ing.map((g,i)=>`<div class="ing ${g.s==1?'x':''}"><span>${cap(g.n)}${g.s==2?' <b class="pill">x2</b>':''}</span>
<button data-a="del" data-i="${i}" class="${g.s==1?'on':''}">Cancella</button><button data-a="dbl" data-i="${i}" class="${g.s==2?'on':''}">Doppio${dp(g.n)?' +'+E(dp(g.n)).slice(2):''}</button></div>`).join(''):(d.cat=='B'?'<p class="empty">Base 7,00 € + gli ingredienti scelti dalle Aggiunte.</p>':'<p class="empty">Il listino Excel non indica gli ingredienti di questa pizza.<br>Usa Aggiunte e Note per le modifiche.</p>')}</div>
<div class="box o"><h3>AGGIUNTE</h3><div class="chips">${Object.keys(d.agg).map(k=>`<span class="chip on">${k}${d.agg[k]>1?' x'+d.agg[k]:''}</span>`).join('')}<button class="chip" data-a="sheet">+ Aggiunte</button></div></div>
<div class="box"><input class="t" placeholder="Note per la cucina (es. ben cotta)" value="${esc(d.note)}" oninput="S.d.note=this.value;upd()"></div>
<div class="box"><h3>RIEPILOGO</h3><div id="sm"></div></div></div>
<div class="dock"><div><span class="tv"></span><button class="btn fill" data-a="ok">Conferma pizza</button></div></div>
${S.sheet?`<div class="sheet" data-a="bg"><div><div class="bar" style="position:static;border:0;padding:0 0 6px;grid-template-columns:1fr auto"><h2 style="text-align:left">AGGIUNTE</h2><button class="btn org fill" data-a="close">Fatto</button></div>
${AG.map(g=>`<h3>${g[0].toUpperCase()} +${E(g[1]).slice(2)}</h3>`+g[2].split('|').map(n=>`<div class="ag"><span>${n}</span><div class="q"><button data-a="am" data-v="${esc(n)}">−</button><b>${d.agg[n]||0}</b><button data-a="ap" data-v="${esc(n)}">+</button></div></div>`).join('')).join('')}</div></div>`:''}`}
function upd(){const d=S.d;if(!d)return;document.querySelectorAll('.tv').forEach(e=>e.textContent=E(unit(d)));
 const s=document.getElementById('sm');if(s)s.innerHTML=`<b>${esc(head(d))}</b>${mods(d).map(m=>`<div class="m">${esc(m)}</div>`).join('')}`}

function vCart(){return`<div class="bar"><button class="btn" data-a="back">‹ Menu</button><h2>ORDINE</h2><span></span></div><div class="wrap n"><div class="box">
${S.cart.map((l,i)=>`<div class="line"><div><b>${esc(l.h)}</b>${l.m.map(m=>`<div class="m">${esc(m)}</div>`).join('')}</div>
<div class="q"><button data-a="lm" data-i="${i}">−</button><b>${l.q}</b><button data-a="lp" data-i="${i}">+</button></div><b style="min-width:86px;text-align:right">${E(l.u*l.q)}</b></div>`).join('')||'<p>Nessuna pizza nell’ordine.</p>'}
<div class="tot"><span>Totale</span><span>${E(total())}</span></div></div>
<div class="box"><input class="t" placeholder="Nome cliente / tavolo (facoltativo)" value="${esc(S.name)}" oninput="S.name=this.value"></div>
<div style="display:flex;gap:10px"><button class="btn" data-a="clear">Annulla</button><button class="btn fill" style="flex:1;font-size:19px" data-a="done" ${S.cart.length?'':'disabled'}>Conferma ordine e crea biglietto</button></div></div>`}

function tk(o,kind){const c=kind=='CUCINA',t=new Date(o.t);
 return`<div class="ticket ${c?'c':''}"><h4>PIZZERIA SAN LAZZARO</h4><div class="k">${kind} · N° ${o.n}</div>
<div class="r"><span>${t.toLocaleDateString('it-IT')}</span><span>${t.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})}</span></div>${o.name?`<div>${esc(o.name)}</div>`:''}<hr>
${o.items.map(l=>`<div class="it r"><span>${l.q}x ${esc(l.h)}</span>${c?'':`<span>${E(l.u*l.q)}</span>`}</div>${l.m.map(m=>`<div class="md">${esc(m)}</div>`).join('')}`).join('')}
<hr>${c?`<div class="r"><span>Pizze</span><span>${o.items.reduce((s,l)=>s+l.q,0)}</span></div>`:`<div class="r" style="font-size:20px"><span>TOTALE</span><span>${E(o.tot)}</span></div>`}</div>`}
function vTicket(){const o=S.order;return`<div class="bar noprint" style="grid-template-columns:1fr auto auto"><h2 style="text-align:left">ORDINE N° ${o.n}</h2><button class="btn" data-a="print">Stampa</button>${S.hist?'<button class="btn fill" data-a="hb">‹ Storico</button>':'<button class="btn fill" data-a="neworder">Nuovo ordine</button>'}</div>
<div class="tickets">${tk(o,'CASSA')}${tk(o,'CUCINA')}</div>`}

function R(){const sh=document.querySelector('.sheet>div'),st=sh?sh.scrollTop:0;
 document.getElementById('app').innerHTML=({hist:vHist,menu:vMenu,pizza:vPizza,cart:vCart,ticket:vTicket,db:vDb,dbedit:vEdit})[S.view]();
 const n=document.querySelector('.sheet>div');if(n)n.scrollTop=st;upd()}
function nextNum(){const d=dk(Date.now());return H.filter(o=>dk(o.t)==d).reduce((m,o)=>Math.max(m,o.n),0)+1}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,i=+el.dataset.i,v=el.dataset.v,d=S.d;
 if(a=='bg'&&e.target!==el)return;
 if(a=='tab')S.tab=v;
 else if(a=='db'){S.view='db';S.q='';S.f=''}
 else if(a=='dbback')S.view='db';
 else if(a=='flt')S.f=v;
 else if(a=='edit'){const p=P[i];S.e={i,n:p[0],c:p[3],p:String(p[1]).replace('.',','),m:p[5]?String(p[5]).replace('.',','):'',g:p[2],a:p[4]};S.view='dbedit'}
 else if(a=='new'){S.e={i:-1,n:'',c:'A',p:'',m:'',g:'',a:0};S.view='dbedit'}
 else if(a=='ec')S.e.c=v;
 else if(a=='eau')S.e.a=S.e.a?0:1;
 else if(a=='esave'){const e=S.e,pr=pf(e.p);if(!e.n.trim()){alert('Inserisci il nome');return}if(pr==null||pr<0){alert('Inserisci un prezzo valido');return}
  const row=[e.n.trim().toUpperCase(),pr,e.g.split(',').map(s=>s.trim().toLowerCase()).filter(Boolean).join(', '),e.c,e.a?1:0,pf(e.m)||null];
  if(e.i>=0)P[e.i]=row;else P.push(row);sortP();save();S.view='db'}
 else if(a=='edel'){if(confirm('Eliminare questa pizza dal database?')){P.splice(S.e.i,1);save();S.view='db'}}
 else if(a=='export')dl();
 else if(a=='impb'){document.getElementById('imp').click();return}
 else if(a=='reset'){if(confirm('Ripristinare il listino iniziale? Le modifiche fatte andranno perse.')){try{localStorage.removeItem('pizzeriaDB')}catch(e){}P=P0.map(norm);ensureBase();sortP()}}
 else if(a=='base'){S.d=newDraft(P.find(p=>p[3]=='B'));S.view='pizza';S.sheet=true}
 else if(a=='pz'){S.d=newDraft(P[i]);S.view='pizza'}
 else if(a=='back')S.view='menu';
 else if(a=='size')d.size=v;
 else if(a=='imp')d.imp=v;
 else if(a=='del')d.ing[i].s=d.ing[i].s==1?0:1;
 else if(a=='dbl')d.ing[i].s=d.ing[i].s==2?0:2;
 else if(a=='sheet')S.sheet=true;
 else if(a=='close'||a=='bg')S.sheet=false;
 else if(a=='ap')d.agg[v]=(d.agg[v]||0)+1;
 else if(a=='am'){if(d.agg[v]>1)d.agg[v]--;else delete d.agg[v]}
 else if(a=='ok'){if(d.size=='M'&&!d.p[5]&&!mx(d)){alert('Inserisci il prezzo MAXI');return}S.cart.push({h:head(d),m:mods(d),u:unit(d),q:1});S.view='menu'}
 else if(a=='cart')S.view='cart';
 else if(a=='lp')S.cart[i].q++;
 else if(a=='lm'){if(--S.cart[i].q<1)S.cart.splice(i,1);if(!S.cart.length)S.view='menu'}
 else if(a=='clear'){if(confirm('Annullare tutto l’ordine?')){S.cart=[];S.name='';S.view='menu'}}
 else if(a=='done'){S.order={n:nextNum(),t:Date.now(),name:S.name,items:JSON.parse(JSON.stringify(S.cart)),tot:total()};H.push(S.order);saveH();S.hist=false;S.view='ticket'}
 else if(a=='hist')S.view='hist';
 else if(a=='ho'){S.order=H[i];S.hist=true;S.view='ticket'}
 else if(a=='hb'){S.hist=false;S.view='hist'}
 else if(a=='hexp')dlf('storico-ordini.csv','\ufeff'+csv(),'text/csv')
 else if(a=='hclr'){if(confirm('Cancellare TUTTO lo storico ordini? Non si può annullare.')){H=[];saveH()}}
 else if(a=='print')window.print();
 else if(a=='neworder'){S.cart=[];S.name='';S.order=null;S.view='menu'}
 R();if(['ok','back','done','new','pz','tab','cart','hist','ho','hb','db','dbback','edit','esave','edel','base'].includes(a))window.scrollTo(0,0)});
R();
</script></body></html>
